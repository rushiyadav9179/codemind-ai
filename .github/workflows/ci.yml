name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: codemind
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: codemind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codemind -d codemind_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://codemind:changeme@localhost:5432/codemind_test?schema=public
      TEST_DATABASE_URL: postgresql://codemind:changeme@localhost:5432/codemind_test?schema=public

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply database migrations
        run: npm run prisma:migrate:deploy --workspace=apps/api

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type checks
        run: npm run typecheck

      - name: Run tests
        run: npm run test

  build:
    name: Build All Packages
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared library
        run: npm run build:shared

      - name: Build frontend
        run: npm run build:web

      - name: Build backend
        run: npm run build:api
